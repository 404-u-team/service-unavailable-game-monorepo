services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-core_api}
            POSTGRES_PORT: ${POSTGRES_PORT:-5432}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d core_api"]
            interval: 5s
            timeout: 5s
            retries: 5

    core-api:
        build: .
        env_file: .env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-core_api}
        ports:
            - "${API_PORT:-8000}:8000"
        depends_on:
            db:
                condition: service_healthy

volumes:
    postgres_data:
